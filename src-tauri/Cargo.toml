[package]
name = "piu"
version = "0.1.0"
description = "A native macOS workspace for agentic software development"
authors = ["Emin"]
edition = "2024"
rust-version = "1.98"
default-run = "piu"

[lib]
name = "piu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
base64 = "=0.22.1"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
fs4 = "=1.1.0"
futures-util = "=0.3.34"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream", "system-proxy"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rustix = { version = "=1.1.4", features = ["process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.189"
objc2-foundation = { version = "=0.3.2", features = ["NSString", "NSUserDefaults"] }
security-framework = "=3.7.0"

[dev-dependencies]
axum = "=0.8.9"
tauri = { version = "=2.11.5", features = ["test"] }
tempfile = "=3.27.0"
