[package]
name = "piu"
version = "0.1.0"
description = "A native macOS workspace for agentic software development"
authors = ["Emin"]
edition = "2024"
rust-version = "1.98"
default-run = "piu"

[lib]
name = "piu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "=2.7.2"
thiserror = "=2.0.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }

[dev-dependencies]
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["test"] }
tempfile = "=3.27.0"
