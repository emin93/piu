name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-and-package:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run smoke:packaged
